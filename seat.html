<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt vé</title>
  <link
      rel="shortcut icon"
      href="./assets/img/logocinemasuperultraprovipmaxplus.webp"
      type="image/x-icon"
    />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" /> 
  <link rel="stylesheet" href="assets/css/menu.css" />
  <link rel="stylesheet" href="./assets/css/seat.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="assets/js/cinema-store.js"></script>
</head>

  <body>

    <div id="header">
      <div class="nav-logo">
        <a href="./index.html">
          <img src="./assets/img/logocinemasuperultraprovipmaxplus.webp" alt="" />
        </a>
      </div>

      <div class="nav-layout">
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a
              class="nav-link active"
              aria-current="page"
              href="index.html"
              >Trang chủ</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="new.html">Tin tức</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#movie-pills-nav">Đặt vé</a>
          </li>
        </ul>
        <div></div>
        <div class="login-user"></div>
      </div>
    </div>

    <div class="app">
      <main class="layout">
        <aside class="sidebar">
          <div class="poster">
            <img src="./assets/img/logocinemasuperultraprovipmaxplus.webp" alt="Poster" />
          </div>
          
          <h2>Tên phim</h2> 
          
          <p>Ngày chiếu: <strong>Chưa chọn</strong></p>
          <p>Suất chiếu: <strong>Chưa chọn</strong></p>

          <div class="summary">
            <p><span id="count">0</span> ghế • <span id="total">0₫</span></p>
            <button id="payBtn" disabled>Thanh toán</button>
          </div>

          <div class="legend">
            <span class="seat normal"></span> Thường (50k)
            <span class="seat vip"></span> VIP (100k)
            <span class="seat booked"></span> Đã đặt
            <span class="seat selected"></span> Đang chọn
          </div>
        </aside>

        <section class="cinema">
          <div class="screen">
            <img src="./assets/img/screen.webp" alt="Màn hình chiếu" />
          </div>

          <div id="seatMap" class="seat-map">
          </div>
        </section>
      </main>

      <div id="overlay" class="overlay hidden">
        <div class="modal">
          <button id="closePay" class="close">&times;</button>
          <h2>Xác nhận thanh toán</h2>

          <ul id="selectedList" class="seat-list"></ul>

          <div class="total">
            <span>Tổng cộng:</span> <strong id="payTotal">0₫</strong>
          </div>

          <div class="qr">
            <h4>Quét mã để thanh toán</h4>
            <img id="qrImage" src="./assets/img/qr.png" alt="QR" />
          </div>

          <button id="confirmPay" class="confirm">Hoàn tất</button>
        </div>
      </div>
    </div>

    <script src="./assets/js/movie-data.js"></script>
    <script src="./assets/js/seat.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
